name: tests
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: shellcheck audit.sh
      - run: python -m pytest -v
      - name: Self-audit the CI runner (read-only)
        run: sudo ./audit.sh -o ci-report --html || true
